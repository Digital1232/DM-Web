<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear Leaves - Admin Utility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-lg shadow-lg p-8 max-w-md w-full">
        <h1 class="text-2xl font-bold mb-6">🗑️ Clear All Leaves</h1>
        
        <div id="loginSection" class="mb-6">
            <div class="mb-4">
                <input type="email" id="email" placeholder="Email" class="w-full px-4 py-2 bg-slate-700 rounded border border-slate-600 text-white placeholder-slate-400 mb-3">
                <input type="password" id="password" placeholder="Password" class="w-full px-4 py-2 bg-slate-700 rounded border border-slate-600 text-white placeholder-slate-400">
            </div>
            <button onclick="loginUser()" class="w-full bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded font-bold">Login</button>
        </div>

        <div id="actionSection" class="hidden">
            <p id="userInfo" class="text-sm text-slate-300 mb-4"></p>
            <button onclick="clearAllLeaves()" class="w-full bg-rose-600 hover:bg-rose-700 px-4 py-2 rounded font-bold mb-2">Clear All Leaves</button>
            <button onclick="logoutUser()" class="w-full bg-slate-600 hover:bg-slate-700 px-4 py-2 rounded font-bold">Logout</button>
        </div>

        <div id="status" class="mt-6 p-4 rounded bg-slate-700 text-sm max-h-64 overflow-auto hidden">
            <h3 class="font-bold mb-2">Status:</h3>
            <div id="statusLog"></div>
        </div>
    </div>

    <script>
        const FB_CONFIG = {
            apiKey: "AIzaSyAL7Z1D_Lhbu-eW9qgiP4hs25ccv_hRu3w",
            authDomain: "worksync-vilpower.firebaseapp.com",
            databaseURL: "https://worksync-vilpower-default-rtdb.firebaseio.com",
            projectId: "worksync-vilpower",
            storageBucket: "worksync-vilpower.firebasestorage.app",
            messagingSenderId: "738955842044",
            appId: "1:738955842044:web:44d3a76012329578186279"
        };

        const app = firebase.initializeApp(FB_CONFIG);
        const auth = firebase.auth(app);
        const db = firebase.database(app);

        function showStatus(msg) {
            const log = document.getElementById('statusLog');
            log.innerHTML += msg + '<br>';
            document.getElementById('status').classList.remove('hidden');
        }

        async function loginUser() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert('Please enter email and password');
                return;
            }

            try {
                showStatus('🔄 Logging in...');
                await auth.signInWithEmailAndPassword(email, password);
                showStatus('✅ Login successful');
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('actionSection').classList.remove('hidden');
                document.getElementById('userInfo').textContent = `Logged in as: ${email}`;
            } catch (err) {
                showStatus(`❌ Login failed: ${err.message}`);
            }
        }

        async function clearAllLeaves() {
            try {
                showStatus('🔄 Fetching all requests...');
                
                const snapshot = await db.ref('worksync/requests').once('value');
                const requests = snapshot.val();

                if (!requests) {
                    showStatus('✅ No requests found');
                    return;
                }

                const leaveIds = Object.keys(requests).filter(id => requests[id].type === 'leave');

                if (leaveIds.length === 0) {
                    showStatus('✅ No leave requests found to delete');
                    return;
                }

                showStatus(`📋 Found ${leaveIds.length} leave request(s)`);

                let deleted = 0;
                for (const id of leaveIds) {
                    try {
                        await db.ref(`worksync/requests/${id}`).remove();
                        showStatus(`✅ Deleted: ${id}`);
                        deleted++;
                    } catch (err) {
                        showStatus(`❌ Failed to delete ${id}: ${err.message}`);
                    }
                }

                showStatus(`\n🎉 Successfully deleted ${deleted}/${leaveIds.length} leave request(s)`);
            } catch (err) {
                showStatus(`❌ Error: ${err.message}`);
            }
        }

        async function logoutUser() {
            try {
                await auth.signOut();
                document.getElementById('loginSection').classList.remove('hidden');
                document.getElementById('actionSection').classList.add('hidden');
                document.getElementById('status').classList.add('hidden');
                document.getElementById('statusLog').innerHTML = '';
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                showStatus('✅ Logged out');
            } catch (err) {
                showStatus(`❌ Logout failed: ${err.message}`);
            }
        }

        // Check if already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('actionSection').classList.remove('hidden');
                document.getElementById('userInfo').textContent = `Logged in as: ${user.email}`;
            }
        });
    </script>
</body>
</html>
