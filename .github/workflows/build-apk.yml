name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Initialize Capacitor and Generate Android Project
        run: |
          echo "Installing Capacitor..."
          npm install --no-audit --prefer-offline @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          echo "Initializing Capacitor Project..."
          npx cap init "One Desk" "com.vilpower.onedesk" --web-dir "."
          
          echo "Adding Android Platform..."
          npx cap add android
          
          echo "Syncing Web Assets..."
          npx cap sync android

      - name: Build Debug Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OneDesk-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
