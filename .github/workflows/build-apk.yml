name: Deploy Live App & Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-and-apk"
  cancel-in-progress: false

jobs:
  deploy-pages:
    name: Deploy to GitHub Pages (Live Instant Updates)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build-apk:
    name: Build Android APK
    needs: deploy-pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Web Assets for Capacitor
        run: |
          echo "Preparing www directory..."
          mkdir -p www
          rsync -av --exclude='node_modules' --exclude='.git' --exclude='android' --exclude='.github' --exclude='www' --exclude='scratch' ./ www/

      - name: Initialize Capacitor and Generate Android Project
        run: |
          echo "Installing Capacitor..."
          npm install --no-audit --prefer-offline @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          
          echo "Adding Android Platform with Live URL configuration..."
          npx cap add android
          
          echo "Syncing Assets..."
          npx cap sync android

      - name: Build Debug Android APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OneDesk-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
