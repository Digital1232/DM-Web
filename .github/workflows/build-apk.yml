name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Android APK
        run: |
          mkdir -p android-twa
          bubblewrap init --manifest="https://worksync-vilpower.firebaseapp.com/manifest.json" --directory="./android-twa" --skipPwaValidation || true
          if [ -d "./android-twa" ]; then
            cd ./android-twa && bubblewrap build --skipPwaValidation || true
          fi
        continue-on-error: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneDesk-Android-APK
          path: |
            **/*.apk
            android-twa/**/*.apk
          if-no-files-found: warn
